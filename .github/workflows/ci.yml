name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*' # matches node = "lts" in .mise.toml
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check Lua formatting
        run: npm run lint:lua:check

      - name: Syntax-check shell scripts
        run: |
          set -e
          scripts=()
          for f in setup.sh setup/brew.sh setup/local.sh setup/misc.sh setup/macos.sh setup/symlinks.sh; do
            [ -f "$f" ] && scripts+=("$f")
          done
          for f in herdr/plugins/*/*.sh; do
            scripts+=("$f")
          done
          for f in bin/*; do
            head -1 "$f" | grep -qE '^#!.*(bash|sh)' && scripts+=("$f")
          done
          for f in "${scripts[@]}"; do
            echo "checking $f"
            bash -n "$f"
          done

      - name: Validate Brewfile parses as Ruby
        run: ruby -c setup/Brewfile
