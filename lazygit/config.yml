# https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md
# Opens from herdr (ctrl+alt+g), tmux, the shell, or nvim (<leader>gg, where snacks.nvim
# layers its colorscheme-matched theme over this one).

gui:
  sidePanelWidth: 0.25
  expandFocusedSidePanel: true
  nerdFontsVersion: '3'
  showRandomTip: false
  # Colors: Bereghici Dark/Light, merged after this file through LG_CONFIG_FILE (zsh/env.zsh)

git:
  # delta with the Bereghici feature for the current appearance, side by side when there is room.
  # Line numbers are links: click one to open that line in the editor. | cycles to git's own diff.
  diffRenderers:
    - name: delta
      command: >-
        delta-themed --paging=never {{if gt .width 160}}--side-by-side{{end}} --hyperlinks
        --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
    - type: rawGit
      name: git

# Back to lazygit right after :q, without a "press enter" stop
promptToReturnFromSubprocess: false

os:
  # Inside nvim (<leader>gg) files open in that nvim; elsewhere (the herdr or tmux popup)
  # a new nvim takes over until :q
  editPreset: nvim-remote

customCommands:
  # Preview the selected file in nvim (snacks.image renders images); quit with :q
  - key: 'V'
    context: 'files'
    description: 'View file (image preview)'
    command: 'nvim {{.SelectedFile.Name | quote}}'
    output: terminal
  - key: 'V'
    context: 'commitFiles'
    description: 'View file (image preview)'
    command: 'nvim {{.SelectedCommitFile.Name | quote}}'
    output: terminal
