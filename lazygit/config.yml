# https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md
# Opens from herdr (ctrl+alt+g), tmux, the shell, or nvim (<leader>gg, where snacks.nvim
# layers its colorscheme-matched theme over this one).

gui:
  sidePanelWidth: 0.25
  expandFocusedSidePanel: true
  nerdFontsVersion: '3'
  showRandomTip: false
  # Rosé Pine (rose-pine/lazygit): main on a dark background, Dawn on a light one
  colorScheme: auto
  darkTheme:
    activeBorderColor: ['#31748f', bold]
    inactiveBorderColor: ['#6e6a86']
    searchingActiveBorderColor: ['#ebbcba', bold]
    optionsTextColor: ['#9ccfd8']
    selectedLineBgColor: ['#31748f']
    inactiveViewSelectedLineBgColor: ['#26233a', bold]
    cherryPickedCommitFgColor: ['#1f1d2e']
    cherryPickedCommitBgColor: ['#ebbcba']
    markedBaseCommitFgColor: ['#9ccfd8']
    markedBaseCommitBgColor: ['#f6c177']
    unstagedChangesColor: ['#eb6f92']
    defaultFgColor: ['#e0def4']
  lightTheme:
    activeBorderColor: ['#286983', bold]
    inactiveBorderColor: ['#9893a5']
    searchingActiveBorderColor: ['#d7827e', bold]
    optionsTextColor: ['#56949f']
    selectedLineBgColor: ['#286983']
    inactiveViewSelectedLineBgColor: ['#f2e9e1', bold]
    cherryPickedCommitFgColor: ['#fffaf3']
    cherryPickedCommitBgColor: ['#d7827e']
    markedBaseCommitFgColor: ['#56949f']
    markedBaseCommitBgColor: ['#ea9d34']
    unstagedChangesColor: ['#b4637a']
    defaultFgColor: ['#575279']

git:
  # delta with the Rosé Pine feature from ~/.themes.gitconfig, side by side when there is room.
  # Line numbers are links: click one to open that line in the editor. | cycles to git's own diff.
  diffRenderers:
    - name: delta
      command: >-
        delta --paging=never {{if gt .width 160}}--side-by-side{{end}} --hyperlinks
        --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
    - type: rawGit
      name: git

# Back to lazygit right after :q, without a "press enter" stop
promptToReturnFromSubprocess: false

os:
  # Inside nvim (<leader>gg) files open in that nvim; elsewhere (the herdr or tmux popup)
  # a new nvim takes over until :q
  editPreset: nvim-remote

customCommands:
  # Preview the selected file in nvim (snacks.image renders images); quit with :q
  - key: 'V'
    context: 'files'
    description: 'View file (image preview)'
    command: 'nvim {{.SelectedFile.Name | quote}}'
    output: terminal
  - key: 'V'
    context: 'commitFiles'
    description: 'View file (image preview)'
    command: 'nvim {{.SelectedCommitFile.Name | quote}}'
    output: terminal
