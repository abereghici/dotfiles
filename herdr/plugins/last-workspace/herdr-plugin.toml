# tmux's `switch-client -l` for herdr: remembers the previously focused workspace and
# switches back to it (prefix Tab and ctrl+alt+o in config.toml). Linked by setup/misc.sh.
id = "dotfiles.last-workspace"
name = "Last workspace"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Switch to the previously focused workspace"
platforms = ["macos", "linux"]

[[events]]
on = "workspace.focused"
command = ["bash", "last-workspace.sh", "record"]

[[actions]]
id = "switch"
title = "Last workspace"
contexts = ["workspace"]
command = ["bash", "last-workspace.sh", "switch"]
