format = """
$username \
$directory \
$git_branch \
$fill \
$c \
$elixir \
$elm \
$golang \
$haskell \
$java \
$julia \
$nodejs \
$nim \
$rust \
$scala \
$python \
$docker_context \
$time\n  \
[󱞪 ](fg:magenta)
"""

palette = "bereghici_terminal"

# From abereghici/themes ports/starship/themes/bereghici-terminal.toml: paste it again when it changes
# (tests/setup.bats notices)
# Bereghici Terminal for Starship. Generated from abereghici/themes; do not edit.
# In the terminal's ANSI colors: with a Bereghici terminal theme it switches with it between
# Dark and Light.
# Paste this table into starship.toml, under `palette = "bereghici_terminal"`.
# surface and surface_raised are the terminal's own background, so they aren't in it.
[palettes.bereghici_terminal]
surface_nested = "0"
text_subtlest = "8"
text_subtle = "7"
text = "15"
line_highlight = "0"
selection = "0"
border = "8"
accent = "2"
red = "1"
yellow = "3"
green = "2"
cyan = "6"
blue = "4"
magenta = "5"
red_bright = "9"
yellow_bright = "11"
green_bright = "10"
cyan_bright = "14"
blue_bright = "12"
magenta_bright = "13"

[directory]
format = "[](fg:surface_nested)[ $path ]($style)[](fg:surface_nested)"
style = "bg:surface_nested fg:green"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
Documents = "󰈙"
Downloads = " "
Music = " "
Pictures = " "

[fill]
style = "fg:surface_nested"
symbol = " "

[git_branch]
format = "[](fg:surface_nested)[ $symbol $branch ]($style)[](fg:surface_nested)"
style = "bg:surface_nested fg:blue"
symbol = ""

[time]
disabled = false
format = "[](fg:surface_nested)[ $time 󰴈 ]($style)[](fg:surface_nested)"
style = "bg:surface_nested fg:cyan"
time_format = "%I:%M%P"

[username]
disabled = false
format = "[](fg:surface_nested)[ \U00100000 $user ]($style)[](fg:surface_nested)"
show_always = true
style_root = "bg:surface_nested fg:magenta"
style_user = "bg:surface_nested fg:magenta"

# Languages

[c]
style = "bg:surface_nested fg:green"
format = "[](fg:surface_nested)[$symbol$version]($style)[](fg:surface_nested) "
disabled = false
symbol = " "

[elixir]
style = "bg:surface_nested fg:green"
format = "[](fg:surface_nested)[$symbol$version]($style)[](fg:surface_nested) "
