set-option -g default-shell /bin/zsh

## Update prefix key to Alt+Space
unbind C-b
set -g prefix M-Space

# Notes (-N) show up in `prefix ?`. Rename window is tmux's default `prefix ,`.
bind -N "Choose session" S choose-session
bind -N "New named window" c command-prompt -p "window name:" "new-window; rename-window '%%'"
bind -N "Project picker" f display-popup -w 80% -h 80% -E 'zsh -l -c "projects tmux"'
bind -N "New project" g display-popup -w 80% -h 80% -E 'zsh -l -c "projects tmux -c"'
bind -N "Last session" Tab switch-client -l

# Direct chords, no prefix: Ctrl+Alt is the multiplexer's modifier family.
# Keys sit on the right hand, for home-row mods that send Ctrl+Alt.
bind -n -N "Pane left" C-M-h select-pane -L
bind -n -N "Pane down" C-M-j select-pane -D
bind -n -N "Pane up" C-M-k select-pane -U
bind -n -N "Pane right" C-M-l select-pane -R
bind -n -N "Project picker" C-M-p display-popup -w 80% -h 80% -E 'zsh -l -c "projects tmux"'
bind -n -N "Last (other) session" C-M-o switch-client -l

# Start selecting text with "v"
bind -T copy-mode-vi 'v' send -X begin-selection
# Copy text with "y" (handled by tmux-yank for cross-terminal clipboard support)

# Split panes (like Vim's Ctrl-W s / Ctrl-W v)
bind -N "Split below" s split-window -v -c "#{pane_current_path}"
bind -N "Split right" v split-window -h -c "#{pane_current_path}"

# Resize mode, like AeroSpace and herdr: prefix r, then h/j/k/l as often as needed
bind -N "Resize mode (hjkl, Esc to finish)" r switch-client -T resize \; display-message "resize: h j k l · Esc to finish"
bind -T resize h resize-pane -L 5 \; switch-client -T resize
bind -T resize j resize-pane -D 5 \; switch-client -T resize
bind -T resize k resize-pane -U 5 \; switch-client -T resize
bind -T resize l resize-pane -R 5 \; switch-client -T resize
bind -T resize Escape switch-client -T root

# Move between panes
bind -N "Pane left" h select-pane -L
bind -N "Pane down" j select-pane -D
bind -N "Pane up" k select-pane -U
bind -N "Pane right" l select-pane -R

# Swap with the pane in that direction: Shift = move, like AeroSpace and herdr.
# -d keeps focus on the pane you moved.
bind -N "Swap pane left" H swap-pane -d -t "{left-of}"
bind -N "Swap pane down" J swap-pane -d -t "{down-of}"
bind -N "Swap pane up" K swap-pane -d -t "{up-of}"
bind -N "Swap pane right" L swap-pane -d -t "{right-of}"

# Start indexing windows at 1 instead of 0
set -g base-index 1
# Switch to the most recently active remaining session instead of detaching when a session closes
set -g detach-on-destroy off
# Zero-out escape time delay
set -g escape-time 0
# Increase history size (from 2,000)
set -g history-limit 1000000
# Renumber all windows when any window is closed
set -g renumber-windows on
# Use system clipboard
set -g set-clipboard on
# Status bar at the top
set -g status-position top
# Popups (project picker) and menus use the pane background, not tmux's themedarkgrey
set -g popup-style bg=default
set -g popup-border-style fg=#403d52
set -g menu-style bg=default
set -g menu-border-style fg=#403d52

set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB"

setw -g mode-keys vi

set -g mouse on

# Image support
# https://github.com/folke/snacks.nvim/blob/main/docs/image.md
set -g allow-passthrough on
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'rose-pine/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @rose_pine_variant 'main' # Options are 'main', 'moon' or 'dawn'
set -g @rose_pine_disable_active_window_menu 'on'
set -g @rose_pine_bar_bg_disable 'on'
set -g @rose_pine_user 'on'
set -g @rose_pine_host 'on'

run "~/.config/tmux/plugins/tpm/tpm"
