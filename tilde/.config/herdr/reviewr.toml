# herdr-reviewr (https://github.com/persiyanov/herdr-reviewr), installed by setup/misc.sh.
# ctrl+alt+r toggles it beside the agent (herdr config.toml); it also opens on its own in
# new worktree workspaces.
#
# reviewr reads one config.toml with no includes, so `herdr-reviewr-config` writes it from
# this file plus the untracked ~/.config/herdr/reviewr.local.toml (work hosts such as
# gitlab_host). Add keys there, don't repeat these: TOML rejects a key set twice.
theme = "rose-pine"
# Prefixed to every send, so the agent knows what the comments are
review_prefix = "Code review comments on your changes. Address each one, then run the checks."
