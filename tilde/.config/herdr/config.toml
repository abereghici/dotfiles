# herdr: prefix Alt+Space, then one key, to DO something (create, close, rename, split, tools).
# Ctrl+Alt chords, no prefix, to MOVE: h/j/k/l panes (nvim-aware), a agents, o other
# workspace, p projects, g git, 1..9 workspace. Alt+1..9 = Agents row, Ctrl+Tab = tabs.
# tmux session = herdr workspace, tmux window = herdr tab. Only changes from
# `herdr --default-config` are listed. Check with `herdr config check` before reloading.

onboarding = false

[theme]
name = "rose-pine"

[theme.custom]
# Let Ghostty's translucent background through, as tmux does (@rose_pine_bar_bg_disable)
panel_bg = "reset"

[keys]
# Never follow the prefix with an Alt chord: two quick Option taps open Claude's Quick Entry
prefix = "alt+space"

# tmux habits
detach = "prefix+d"
settings = "prefix+colon"
rename_tab = "prefix+comma"
close_tab = "prefix+ampersand"
rename_workspace = "prefix+$"
previous_workspace = "prefix+("
next_workspace = "prefix+)"
last_pane = "prefix+semicolon"
cycle_pane_next = ["prefix+tab", "prefix+o"]
cycle_pane_previous = "prefix+shift+tab"
workspace_picker = ["prefix+w", "prefix+shift+s"]
# vim's :split / :vsplit letters; v (split right) is herdr's default
split_horizontal = ["prefix+s", "prefix+minus"]
# / searches, as in vi; prefix+g is lazygit below
goto = "prefix+slash"
# prefix+N is "New project" below, which creates the folder and its workspace
new_workspace = ""

# Tabs: browser keys (Ghostty's own ctrl+tab is unbound in ghostty/config)
next_tab = ["prefix+n", "ctrl+tab"]
previous_tab = ["prefix+p", "ctrl+shift+tab"]

# Agents across every workspace; a = agent, Alt+N = Nth row of the Agents list
next_agent = "ctrl+alt+a"
previous_agent = "ctrl+alt+shift+a"
focus_agent = "alt+1..9"
open_notification_target = "prefix+a"

# The Nth workspace in the sidebar (tabs are prefix+1..9)
switch_workspace = "ctrl+alt+1..9"

# prefix+r is reviewr below; = sizes panes (h/l width, j/k height, esc)
resize_mode = "prefix+="

# Worktrees: G = new (herdr default), F = find an existing one
open_worktree = "prefix+shift+f"

# Already defaults: c new tab, v split right, h/j/k/l focus, H/J/K/L swap, z zoom, x close
# pane, [ copy mode, e scrollback in $EDITOR, b sidebar, D close workspace, ? help

# ctrl+alt+h/j/k/l: move between nvim splits, then herdr panes (herdr/plugins/pane-nav; nvim
# maps the same chords). Not under focus_pane_*: a built-in action would disable these.
[[keys.command]]
key = "ctrl+alt+h"
type = "plugin_action"
command = "dotfiles.pane-nav.left"
description = "Focus left (nvim split or pane)"

[[keys.command]]
key = "ctrl+alt+j"
type = "plugin_action"
command = "dotfiles.pane-nav.down"
description = "Focus down (nvim split or pane)"

[[keys.command]]
key = "ctrl+alt+k"
type = "plugin_action"
command = "dotfiles.pane-nav.up"
description = "Focus up (nvim split or pane)"

[[keys.command]]
key = "ctrl+alt+l"
type = "plugin_action"
command = "dotfiles.pane-nav.right"
description = "Focus right (nvim split or pane)"

[[keys.command]]
key = ["prefix+f", "ctrl+alt+p"]
type = "popup"
command = 'zsh -l -c "projects herdr"'
description = "Project picker"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+shift+n"
type = "popup"
command = 'zsh -l -c "projects herdr -c"'
description = "New project"
width = "80%"
height = "80%"

# tmux's `switch-client -l`, from the plugin in herdr/plugins/last-workspace
[[keys.command]]
key = "ctrl+alt+o"
type = "plugin_action"
command = "dotfiles.last-workspace.switch"
description = "Other (last) workspace"

# lazygit over the current tab, in the focused pane's repo; q closes it
[[keys.command]]
key = ["prefix+g", "ctrl+alt+g"]
type = "popup"
command = 'zsh -l -c lazygit'
description = "lazygit"
width = "95%"
height = "95%"

# Review the agent's diff and send line comments back to it: herdr-reviewr, installed by
# setup/misc.sh, configured in reviewr.toml. r = review, beside g = git
[[keys.command]]
key = ["prefix+r", "ctrl+alt+r"]
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "Review changes (reviewr)"

[ui]
# tmux-style splits: one divider between panes, no outer frame, gaps or scrollbars
pane_outer_borders = false
pane_gaps = false
pane_scrollbars = false
# The tmux theme shows the host on the status bar
tab_bar_right = [{ type = "hostname" }]
