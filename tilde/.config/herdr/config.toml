# herdr as a drop-in for tmux.conf: same prefix, same keys, same look.
# tmux session = herdr workspace, tmux window = herdr tab, pane = pane.
# Only differences from `herdr --default-config` are listed here.

onboarding = false

[theme]
name = "rose-pine"

[theme.custom]
# Let Ghostty's translucent background through, as tmux does (@rose_pine_bar_bg_disable)
panel_bg = "reset"

[keys]
prefix = "alt+space"

# tmux defaults
detach = "prefix+d"
settings = "prefix+colon"
rename_tab = "prefix+comma"
close_tab = "prefix+ampersand"
rename_workspace = "prefix+$"
previous_workspace = "prefix+("
next_workspace = "prefix+)"
last_pane = "prefix+semicolon"
cycle_pane_next = "prefix+o"
# prefix+o is tmux's next pane; a = jump to the agent asking for attention
open_notification_target = "prefix+a"

# tmux.conf bindings
workspace_picker = ["prefix+w", "prefix+shift+s"]
split_horizontal = "prefix+s"
# prefix+g is "New project" below; / is search, as in vi and copy mode
goto = "prefix+slash"

# Direct chords, no prefix: Ctrl+Alt is the multiplexer's modifier family.
focus_pane_left = ["prefix+h", "ctrl+alt+h"]
focus_pane_down = ["prefix+j", "ctrl+alt+j"]
focus_pane_up = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]

# Already herdr's defaults, matching tmux.conf: c new named tab, v split right, r resize
# mode, H/J/K/L swap panes, z zoom, x close pane, n/p tabs, 1..9 tab, [ copy mode (v, y)

[[keys.command]]
key = "prefix+f"
type = "popup"
command = 'zsh -l -c "projects herdr"'
description = "Project picker"
width = "80%"
height = "80%"

[[keys.command]]
key = "ctrl+alt+p"
type = "popup"
command = 'zsh -l -c "projects herdr"'
description = "Project picker"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+g"
type = "popup"
command = 'zsh -l -c "projects herdr -c"'
description = "New project"
width = "80%"
height = "80%"

# tmux's `switch-client -l`, from the plugin in herdr/plugins/last-workspace
[[keys.command]]
key = "prefix+tab"
type = "plugin_action"
command = "dotfiles.last-workspace.switch"
description = "Last workspace"

[[keys.command]]
key = "ctrl+alt+o"
type = "plugin_action"
command = "dotfiles.last-workspace.switch"
description = "Last (other) workspace"

# Review the agent's diff beside it and send line comments back: herdr-reviewr, installed
# by setup/misc.sh, configured in reviewr.toml (and the untracked reviewr.local.toml)
[[keys.command]]
key = "ctrl+alt+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "Review changes"

[[keys.command]]
key = "prefix+shift+v"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "Review changes"

[ui]
# tmux-style splits: one divider between panes, no outer frame, gaps or scrollbars
pane_outer_borders = false
pane_gaps = false
pane_scrollbars = false
# The tmux theme shows the host on the status bar
tab_bar_right = [{ type = "hostname" }]
